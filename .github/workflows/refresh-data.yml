name: Refresh data

# The dashboard's data is baked in at build time, so it only stays honest if
# something re-runs the fetchers. Weekly is enough: the slowest-moving inputs
# (METR, the SO survey) update a few times a year, and the fastest (Indeed,
# JOLTS, FRED) are monthly.
on:
  schedule:
    - cron: '17 6 * * 1' # Mondays, 06:17 UTC
  workflow_dispatch: # and on demand from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Keyless sources always run; FRED and BLS skip cleanly if the secrets
      # are absent, so a fork without keys still gets a useful refresh.
      - name: Fetch live data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: npm run fetch-data

      # Build before committing: if a source changed shape badly enough to
      # break the site, fail here rather than shipping it.
      - name: Verify the site still builds
        run: npm run build

      - name: Commit refreshed snapshots
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/generated
          if git diff --staged --quiet; then
            echo "No data changed this week."
          else
            git commit -m "chore(data): refresh snapshots [skip ci]"
            git push
          fi
